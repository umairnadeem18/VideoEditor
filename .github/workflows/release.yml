name: Release

# Builds signed-off bundles for Windows (.exe NSIS + .msi), macOS (.dmg + .app.tar.gz)
# and Linux (.AppImage + .deb + .rpm) and publishes them as a GitHub Release.
# Trigger: push a tag like v0.2.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref_type == 'tag' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf librsvg2-bin

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Research Agent v__VERSION__"
          releaseBody: "Cross-platform desktop builds of the Research Agent. Windows: run the -setup.exe installer. macOS: open the .dmg — unsigned, so right-click → Open the first time (or run `xattr -cr /Applications/Research\\ Agent.app`). Linux: AppImage / deb / rpm."
          releaseDraft: false
          prerelease: false
