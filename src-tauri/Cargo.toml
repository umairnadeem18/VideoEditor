[package]
name = "video-editor-agent"
version = "0.1.0"
edition = "2021"
description = "Chat agent that stores your profile and fetches trending research ideas"
rust-version = "1.77"

[lib]
name = "video_editor_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
